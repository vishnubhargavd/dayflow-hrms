version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dayflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dayflow_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-dayflow_hrms}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dayflow_admin} -d ${POSTGRES_DB:-dayflow_hrms}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
